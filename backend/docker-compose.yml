services:
  postgres:
    image: postgres:16-alpine
    container_name: govcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: govcare
      POSTGRES_USER: govcare_user
      POSTGRES_PASSWORD: govcare_pass
    ports:
      - "5432:5432"
    volumes:
      - govcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcare_user -d govcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govcare_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"

volumes:
  govcare_pgdata:
