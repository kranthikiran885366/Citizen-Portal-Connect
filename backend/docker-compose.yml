services:
  postgres:
    image: postgres:16-alpine
    container_name: govcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: govcare
      POSTGRES_USER: govcare_user
      POSTGRES_PASSWORD: govcare_pass
    ports:
      - "5432:5432"
    volumes:
      - govcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcare_user -d govcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govcare_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      NODE_ENV: development
      DATABASE_URL: postgresql://govcare_user:govcare_pass@postgres:5432/govcare
      JWT_SECRET: govcare_jwt_super_secret_key_change_in_production_32chars
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    ports:
      - "5000:5000"
    command: sh -c "node src/config/migrate.js; node src/server.js"

volumes:
  govcare_pgdata:
