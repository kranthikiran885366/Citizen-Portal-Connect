services:
  - type: web
    name: citizen-portal-connect
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/config/migrate.js && node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: 7
      - key: CORS_ORIGIN
        value: https://citizen-portal-connect-1.onrender.com

  - type: static
    name: citizen-portal-connect-1
    rootDir: artifacts/gov-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist/public
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /api/*
        destination: https://citizen-portal-connect.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://citizen-portal-connect.onrender.com
