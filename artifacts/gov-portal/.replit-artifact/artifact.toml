kind = "web"
previewPath = "/"
title = "Government Complaint Portal"
version = "1.0.0"
id = "artifacts/gov-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18350

[services.development]
run = "pnpm --filter @workspace/gov-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gov-portal", "run", "build" ]
publicDir = "artifacts/gov-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18350"
BASE_PATH = "/"
